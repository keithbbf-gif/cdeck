[package]
name = "cdeck"
version = "0.1.0"
description = "cDeck — standalone COSMOS dashboard for Windows 10"
authors = ["Keith"]
edition = "2021"
rust-version = "1.77"

# Must not share the package name: Windows cannot emit both cdeck.exe and cdeck.dll.
[lib]
name = "cdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
